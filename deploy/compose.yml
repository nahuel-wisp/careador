# Una instancia de Careador. Copiar a /srv/careador-<instancia>/compose.yml junto con su .env.
# La imagen y el puerto salen del .env de la instancia (ver env.produccion / env.pruebas).
services:
  app:
    image: ${CAREADOR_IMAGE:-careador:estable}
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "true"
    ports:
      - "${CAREADOR_PORT:-8080}:8080" # Traefik apunta a IP_VM:CAREADOR_PORT
    volumes:
      - ./data:/data
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
